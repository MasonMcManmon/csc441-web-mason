<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Class 16 : Step 1 - My contact page 2 -->
    <title>Contact 2 - Mason M.</title>
    <!-- Class 12: Step 1 - a typeface i choose -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- Class 15: Step 1 - My third file -->
    <script src="script.js" defer></script>
</head>

<body>
     <!-- Class 12 : step 2 : Navigation-->
     <nav>
        <!-- Lab 13 : Task 5 - name link-->
        <a href="index.html">Mason M.</a>
        <ul>
            <!-- Lab 13 : Task 1 - Adding current to links to -->
            <li><a href="index.html">Home</a></li>
            <li><a href="projects.html">Projects</a></li>
            <!-- Lab 13 : Task 3 - Adding page 3 nav-->
            <li><a href="contact.html">Contact</a></li>
            <!-- Class 16 : Step 1 - The contact page 2 link -->
            <li><a href="contact2.html" class="current">Contact 2</a></li>
            <!-- Class 15 : Step 3 - A Theme Button -->        
            <li><button id="theme-toggle" type="button">Light Mode</button></li>
        </ul>
     </nav>
    <!-- Class 11 - Step 2: the page -->
    <header>
        <!-- Class 12 : Step 3 - an image -->
        <img src="images/me.jpg" alt="Portrait of Mason M." class="portrait">
        <!-- Lab 12 : Task 1 - group the text so it stacks beside the photo -->
        <div>
            <h1>Contact 2</h1>
            <p>Please feel free to reach out to me!</p>
        </div>
    </header>

    <main>
        <!-- Class 16 : Step 2 - a form -->
        <form id="Contact-Form">
            <p>
                <label for="Name">Name: </label>
                <input id="Name" name="Name" type="text">
            </p>
            <p> 
                <label for="Email">Email: </label>
                <input id="Email" name="Email" type="email">
            </p>
            <p>
                <label for="Message">Message: </label>
                <textarea id="Message" name="Message" rows="5" required></textarea>
            </p>
            <button type="submit">Submit</button>
        </form>

        <p id="Form-Status" role="status"></p>
    </main>

    <footer>
        <!-- Lab 12 : Task 3 - two things in the footer -->
         <!-- Class 15 : Step 2 - The year written by Java Script -->
        <p> © <span id="year"></span> - Mason M.</p>
        <button id="Back-to-top" type="button">Back to Top</button>
        <!-- Lab 11 - Task 3 - a link off my page -->
        <a href="https://github.com/MasonMcManmon/csc441-web-mason.git" target="_blank" rel="noopener">GitHub</a>
    </footer>

</body>

</html>
